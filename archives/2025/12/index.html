<script>
  /* 使用原生 dialog，支持 Escape、焦点约束和键盘关闭。 */
  (function () {
    var overlay = null;
    var previousFocus = null;
    var previousOverflow = '';
    function openLightbox(source) {
      if (overlay) overlay.close();
      previousFocus = document.activeElement;
      previousOverflow = document.body.style.overflow;
      overlay = document.createElement('dialog');
      overlay.className = 'img-lightbox';
      overlay.setAttribute('aria-label', source.alt || '图片预览');
      var button = document.createElement('button');
      button.type = 'button';
      button.className = 'img-lightbox__close';
      button.setAttribute('aria-label', '关闭图片预览');
      button.textContent = '×';
      var image = document.createElement('img');
      image.src = source.currentSrc || source.src;
      image.alt = source.alt || '';
      overlay.append(button, image);
      var current = overlay;
      current.addEventListener('click', function (event) {
        if (event.target === current || event.target === button) current.close();
      });
      current.addEventListener('close', function () {
        current.remove();
        overlay = null;
        document.body.style.overflow = previousOverflow;
        if (previousFocus) previousFocus.focus();
      }, { once: true });
      document.body.appendChild(current);
      document.body.style.overflow = 'hidden';
      current.showModal();
      button.focus();
    }
    document.querySelectorAll('.post-body img').forEach(function (image) {
      if (image.closest('a, button')) return;
      image.tabIndex = 0;
      image.setAttribute('role', 'button');
      image.setAttribute('aria-label', '放大图片：' + (image.alt || '正文配图'));
      image.addEventListener('click', function () { openLightbox(image); });
      image.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openLightbox(image);
        }
      });
    });
  })();

  /* 右侧目录：滚动时高亮当前小节 */
  (function () {
    var aside = document.querySelector('.post-aside');
    if (!aside) return;

    var links = Array.prototype.slice.call(aside.querySelectorAll('a.nav-link'));
    if (!links.length) return;

    var sections = links.map(function (link) {
      var id = link.getAttribute('href').slice(1);
      try {
        id = decodeURIComponent(id);
      } catch (e) {
        /* 保底：解码失败就用原串 */
      }
      return document.getElementById(id);
    });

    var ticking = false;

    function update() {
      ticking = false;
      var offset = 120;
      var current = 0;
      for (var i = 0; i < sections.length; i++) {
        if (sections[i] && sections[i].getBoundingClientRect().top <= offset) {
          current = i;
        }
      }
      /* 滚到底部时强制高亮最后一项 */
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 2) {
        current = sections.length - 1;
      }
      links.forEach(function (link, index) {
        link.classList.toggle('active', index === current);
      });
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        ticking = true;
        window.requestAnimationFrame(update);
      }
    }, { passive: true });

    update();
  })();
</script>
